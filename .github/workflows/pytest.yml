
name: Digital Wallet Unit Tests

on:
  push:
    branches: [main]
    paths:
      - 'wallet_affordability.py'
      - 'wallet_withdrawal.py'
      - 'test_wallet_affordability.py'
      - 'test_wallet_withdrawal.py'
      - '.github/workflows/pytest.yml'

  pull_request:
    branches: [main]
    paths:
      - 'wallet_affordability.py'
      - 'wallet_withdrawal.py'
      - 'test_wallet_affordability.py'
      - 'test_wallet_withdrawal.py'
      - '.github/workflows/pytest.yml'

concurrency:
  group: digital-wallet-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytest
        run: pip install pytest

      - name: Run unit tests
        run: python -m pytest -v
